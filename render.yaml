services:
  # 1. Python FastAPI Backend Service (Handles Resume PDF Parsing, Gemini Analysis & Vectors)
  - type: web
    name: careeroptic-python-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false

  # 2. Node.js Express Service (Handles Auth & Student Profile Database)
  - type: web
    name: careeroptic-node-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix backend run build
    startCommand: npm --prefix backend start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false

  # 3. Static Frontend (React + Vite)
  - type: web
    name: careeroptic
    env: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: careeroptic-python-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
